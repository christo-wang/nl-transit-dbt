version: 2

sources:
  - name: raw
    description: >
      GTFS as delivered, loaded verbatim by ingest/load_raw.py. Everything is
      VARCHAR on purpose: casting is a modelling decision, not a loading one,
      and a schema change upstream should fail in a model with a readable
      error rather than silently at load time.
    schema: raw
    tables:
      - name: stops
      - name: stop_times
      - name: trips
      - name: routes
      - name: calendar_dates

  - name: buurten_raw
    description: >
      CBS Wijk- en Buurtkaart 2024, boundaries layer only, loaded by
      ingest/load_buurten.py (not the dbt source() mechanism — this table is
      built from a GeoPackage via geopandas, not a plain CSV, so it bypasses
      the usual raw-loading path). Geometry arrives as WKB bytes; stg_buurten
      reconstitutes it with ST_GeomFromWKB.
    schema: raw
    tables:
      - name: buurten
