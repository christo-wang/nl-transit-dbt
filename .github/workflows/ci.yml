name: dbt build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Load GTFS fixture
        # CI runs against the committed sample, never the live feed. A pull
        # request should not fail because a third-party server is down, and it
        # should not pull 200MB on every push.
        run: python ingest/load_raw.py --source fixture

      - name: Load buurten fixture
        # Same reasoning as the GTFS fixture: CI can't pull the real 230MB
        # CBS GeoPackage on every push, so it builds tiny stand-in polygons
        # instead. This is what makes int_stop_buurt's spatial join (and the
        # EPSG:4326 axis-order fix it depends on) something CI actually
        # exercises, not just something that happened to work on one laptop.
        run: python ingest/load_buurten_fixture.py

      - name: Build and test
        run: dbt build

      - name: Reconcile against legacy
        run: python ingest/reconcile.py

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: target/
          retention-days: 7
